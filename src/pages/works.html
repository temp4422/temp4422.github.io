<!doctype html>
<html lang="en">
  <head>
    <title>Works</title>
    <head-x />
    <layout-x />
    <gtm_head-x />
    <style>
      section {
        display: grid;
        place-items: center;
        margin: 6rem auto;
        overflow-x: hidden;
      }

      section#works {
        display: flex;
        flex-flow: row wrap;
        justify-content: center;
        gap: 4rem;
        width: 100%;
        overflow: hidden;
      }
      .works-title {
        width: 100%;
      }

      .work-item {
        display: grid;
        position: relative;
        place-items: center;
        filter: var(--svg-glow);
        transition: var(--svg-transition);
        background: transparent;
        width: 20rem;
        height: 13rem;
      }
      .work-item:hover {
        filter: var(--svg-glow-hover);
        transition: var(--svg-transition-hover);
      }
      .work-item__link {
        display: grid;
        place-items: center;
        background: transparent;
        width: 100%;
        height: 100%;
      }
      .work-item__iframe {
        zoom: 40%;
        z-index: -10;
        border-radius: 1rem;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
      }
    </style>
  </head>
