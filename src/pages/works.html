<!doctype html>
<html lang="en">
  <head>
    <title>Works</title>
    <head-x />
    <layout-x />
    <gtm_head-x />
    <style>
      section#works {
        display: grid;
        place-items: center;
        gap: 4rem;
        margin: 6rem auto;
        padding: 0 1rem;
        width: 100%;
        overflow: hidden;
        overflow-x: hidden;
      }
      @media (min-width: 768px) {
        body.works-page {
          max-width: 1024px;
        }
      }
      .works-title {
        width: 100%;
      }

      .work-item {
        display: grid;
        grid-auto-flow: row;
        gap: 2rem;
        filter: var(--svg-glow);
        transition: var(--svg-transition);
        background: transparent;
        width: 100%;
        height: 100%;
      }
      @media (min-width: 768px) {
        .work-item {
          grid-auto-flow: column;
        }
      }
      .work-item:hover {
        filter: var(--svg-glow-hover);
        transition: var(--svg-transition-hover);
      }
      .work-item__link {
        display: grid;
        place-items: center;
        background: transparent;
        width: 20rem;
        height: 13rem;
      }
      .work-item__iframe {
        zoom: 40%;
        border-radius: 1rem;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
      }
      .work-item__text-wrapper {
        width: 20rem;
        height: 13rem;
        color: var(--color-text);
        font-size: 1.2rem;
        text-align: center;
      }
      @media (min-width: 768px) {
        .work-item__text-wrapper {
          width: 100%;
          max-width: 40rem;
        }
      }
      .work-item__title {
        margin: 1rem;
        padding: 0;
        text-align: center;
      }
      .work-item__text {
        margin: 0.5rem;
        padding: 0;
        text-align: center;
      }
    </style>
  </head>

  <body class="works-page">
    <gtm_body-x />

    <header>
      <navmenu-x />
    </header>

    <main>
      <section id="works">
        <h2 class="works-title">MY WORKS</h2>

        <div class="work-item">
          <a class="work-item__link" target="_blank" href="https://x-drive.ua">
            <iframe
              class="work-item__iframe"
              loading="lazy"
              scrolling="no"
              src="https://x-drive.ua"
            ></iframe>
          </a>
          <div class="work-item__text-wrapper">
            <h3 class="work-item__title" id="target-link-title"></h3>
            <p class="work-item__text" id="target-link-description"></p>
          </div>
        </div>

        <div class="work-item">
          <a class="work-item__link" target="_blank" href="https://alpenkrokus.com/">
            <iframe
              style="background: white"
              class="work-item__iframe"
              loading="lazy"
              scrolling="no"
              src="https://alpenkrokus.com/"
            ></iframe>
          </a>
          <div class="work-item__text-wrapper">
            <h3 class="work-item__title" id="target-link-title"></h3>
            <p class="work-item__text" id="target-link-description"></p>
          </div>
        </div>

        <div class="work-item">
          <a class="work-item__link" target="_blank" href="https://mountain-cake.onrender.com/">
            <iframe
              class="work-item__iframe"
              loading="lazy"
              scrolling="no"
              src="https://mountain-cake.onrender.com/"
            ></iframe>
          </a>
          <div class="work-item__text-wrapper">
            <h3 class="work-item__title" id="target-link-title"></h3>
            <p class="work-item__text" id="target-link-description"></p>
          </div>
        </div>

        <div class="work-item">
          <a class="work-item__link" target="_blank" href="https://kart.temp44.top/">
            <iframe
              class="work-item__iframe"
              loading="lazy"
              scrolling="no"
              src="https://kart.temp44.top/"
            ></iframe>
          </a>
          <div class="work-item__text-wrapper">
            <h3 class="work-item__title" id="target-link-title"></h3>
            <p class="work-item__text" id="target-link-description"></p>
          </div>
        </div>

        <div class="work-item">
          <a class="work-item__link" target="_blank" href="https://solomia-portfolio.netlify.app/">
            <iframe
              class="work-item__iframe"
              loading="lazy"
              scrolling="no"
              src="https://solomia-portfolio.netlify.app/"
            ></iframe>
          </a>
          <div class="work-item__text-wrapper">
            <h3 class="work-item__title" id="target-link-title"></h3>
            <p class="work-item__text" id="target-link-description"></p>
          </div>
        </div>

        <div class="work-item">
          <a
            class="work-item__link"
            target="_blank"
            href="https://temp4422.github.io/freecodecamp.html"
          >
            <iframe
              class="work-item__iframe"
              loading="lazy"
              scrolling="no"
              src="https://temp4422.github.io/freecodecamp.html"
            ></iframe>
          </a>
          <div class="work-item__text-wrapper">
            <h3 class="work-item__title" id="target-link-title"></h3>
            <p class="work-item__text" id="target-link-description"></p>
          </div>
        </div>

        <div class="work-item">
          <a
            class="work-item__link"
            target="_blank"
            href="https://temp4422.github.io/playground.html"
          >
            <iframe
              class="work-item__iframe"
              loading="lazy"
              scrolling="no"
              src="https://temp4422.github.io/playground.html"
            ></iframe>
          </a>
          <div class="work-item__text-wrapper">
            <h3 class="work-item__title" id="target-link-title"></h3>
            <p class="work-item__text" id="target-link-description"></p>
          </div>
        </div>

        <div class="work-item">
          <a class="work-item__link" target="_blank" href="https://passwd.temp44.top/">
            <iframe
              class="work-item__iframe"
              loading="lazy"
              scrolling="no"
              src="https://passwd.temp44.top/"
            ></iframe>
          </a>
          <div class="work-item__text-wrapper">
            <h3 class="work-item__title" id="target-link-title"></h3>
            <p class="work-item__text" id="target-link-description"></p>
          </div>
        </div>

        <div class="work-item">
          <a class="work-item__link" target="_blank" href="https://qr.temp44.top/">
            <iframe
              class="work-item__iframe"
              loading="lazy"
              scrolling="no"
              src="https://qr.temp44.top/"
            ></iframe>
          </a>
          <div class="work-item__text-wrapper">
            <h3 class="work-item__title" id="target-link-title"></h3>
            <p class="work-item__text" id="target-link-description"></p>
          </div>
        </div>
      </section>

      <script>
        document.querySelectorAll('.work-item').forEach(async (item) => {
          try {
            const response = await fetch(item.querySelector('.work-item__link').href)
            const page = new DOMParser().parseFromString(await response.text(), 'text/html')
            item.querySelector('#target-link-title').textContent = page.title
            item.querySelector('#target-link-description').textContent =
              page.querySelector('meta[name="description"]')?.content || ''
          } catch (error) {
            console.error('Could not load work item metadata:', error)
          }
        })
      </script>
    </main>

    <footer>
      <footer-x />
    </footer>
  </body>
</html>
